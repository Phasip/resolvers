name: CI

on:
  workflow_dispatch:
  schedule:
  - cron: "0 4,16 * * *"

permissions:
  contents: write

# Never let two runs update the grade files at the same time
concurrency:
  group: update-resolvers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
      with:
        fetch-depth: 0
    - name: dnsvalidator
      run: |
        set -x
        pipx install git+https://github.com/vortexau/dnsvalidator
        # Keep only IPv4 addresses, drops IPv6, blank lines, CRLF and error pages
        ipv4() { tr -d '\r' | grep -E '^([0-9]{1,3}\.){3}[0-9]{1,3}$' || true; }
        ipv4 < resolvers.txt | sort -R > "$RUNNER_TEMP/untested_resolvers.txt"
        # Fetch each source separately so one being down does not stop the run
        # and a missing trailing newline cannot join two addresses
        for url in https://public-dns.info/nameservers.txt \
                   https://raw.githubusercontent.com/blechschmidt/massdns/master/lists/resolvers.txt; do
            curl -fsSL --retry 3 "$url" || echo "::warning::Failed to fetch $url"
            echo
        done | ipv4 | sort -R >> "$RUNNER_TEMP/untested_resolvers.txt"
        # Only try first 2500 unique and prioritize old resolvers
        awk '!seen[$0]++' "$RUNNER_TEMP/untested_resolvers.txt" | head -n 2500 > "$RUNNER_TEMP/untested_resolvers.head.txt"
        # Try to run dnsvalidator 5 times, as it sometimes times out in beginning
        for i in {1..6}; do \
            rm -f "$RUNNER_TEMP/resolvers-new.txt"
            dnsvalidator -tL "$RUNNER_TEMP/untested_resolvers.head.txt" -threads 10 -o "$RUNNER_TEMP/resolvers-new.txt" && break
            sleep 60;
        done
        echo "Done validating"
        test -e "$RUNNER_TEMP/resolvers-new.txt"
        cat "$RUNNER_TEMP/resolvers-new.txt" | sort | uniq > "$RUNNER_TEMP/resolvers-new-uniq.txt"
        
        for i in {10..1}; do \
            cat "$RUNNER_TEMP/resolvers-new-uniq.txt" resolvers-stable-grade$i.txt \
            | sort -R | uniq -d | sed '/^$/d' > resolvers-stable-grade$((i+1)).txt; 
        done
        
        cat "$RUNNER_TEMP/resolvers-new-uniq.txt" resolvers.txt | sort -R \
           | uniq -d | sed '/^$/d' > resolvers-stable-grade1.txt
        
        sed '/^$/d' "$RUNNER_TEMP/resolvers-new-uniq.txt" | sort -R > resolvers.txt
    - name: Commit resolvers.txt
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add resolvers.txt resolvers-stable-grade{1..11}.txt
        if ! git diff --cached --quiet; then
            git commit -m "Remote version change"
            git push origin "HEAD:$GITHUB_REF"
        fi
